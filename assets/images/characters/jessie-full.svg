<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 400" width="100%" height="100%">
  <defs>
    <linearGradient id="jfHat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="jfHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="jfSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="jfJean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="jfBoot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="jfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra no Chão -->
  <ellipse cx="120" cy="385" rx="55" ry="10" fill="rgba(0,0,0,0.25)"/>

  <!-- Trança Ruiva da Jessie (atrás) -->
  <path d="M 120,95 Q 145,150 135,210" stroke="url(#jfHair)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Laço Amarelo na Trança -->
  <ellipse cx="135" cy="205" rx="7" ry="5" fill="#facc15"/>

  <!-- Pernas com Calça Jeans e Perneiras de Vaqueira -->
  <!-- Perna Esquerda -->
  <path d="M 85,210 L 80,315 L 105,315 L 110,210 Z" fill="url(#jfJean)"/>
  <!-- Perneira Malhada Esquerda (Cow-print chaps) -->
  <path d="M 76,220 L 76,310 L 98,310 L 96,220 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="84" cy="245" r="4" fill="#18181b"/>
  <circle cx="90" cy="275" r="5" fill="#18181b"/>
  <circle cx="82" cy="295" r="3.5" fill="#18181b"/>

  <!-- Perna Direita -->
  <path d="M 130,210 L 135,315 L 160,315 L 155,210 Z" fill="url(#jfJean)"/>
  <!-- Perneira Malhada Direita -->
  <path d="M 144,220 L 142,310 L 164,310 L 164,220 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="152" cy="245" r="5" fill="#18181b"/>
  <circle cx="158" cy="275" r="4" fill="#18181b"/>
  <circle cx="150" cy="298" r="3.5" fill="#18181b"/>

  <!-- Botas de Cowboy -->
  <!-- Bota Esquerda -->
  <g filter="url(#jfShadow)">
    <path d="M 74,310 L 105,310 L 102,365 L 64,365 L 64,348 Q 72,338 74,310 Z" fill="url(#jfBoot)"/>
    <polygon points="102,348 110,352 102,356" fill="#facc15"/>
  </g>
  <!-- Bota Direita -->
  <g filter="url(#jfShadow)">
    <path d="M 135,310 L 166,310 Q 168,338 176,348 L 176,365 L 138,365 Z" fill="url(#jfBoot)"/>
    <polygon points="138,348 130,352 138,356" fill="#facc15"/>
  </g>

  <!-- Cinto com Fivela Redonda -->
  <rect x="80" y="200" width="80" height="14" fill="#78350f"/>
  <ellipse cx="120" cy="207" rx="14" ry="10" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

  <!-- Camisa Branca de Vaqueira com Peitilho Amarelo e Vermelho -->
  <path d="M 75,130 L 165,130 L 160,205 L 80,205 Z" fill="#ffffff" filter="url(#jfShadow)"/>
  <path d="M 75,130 L 165,130 L 155,160 L 85,160 Z" fill="#facc15"/>
  <path d="M 85,145 Q 120,165 155,145" stroke="#dc2626" stroke-width="3" fill="none"/>

  <!-- Botões Redondos Grandes da Jessie -->
  <circle cx="120" cy="172" r="5" fill="#1e3a8a"/>
  <circle cx="120" cy="192" r="5" fill="#1e3a8a"/>

  <!-- Braço Esquerdo Feliz para Cima -->
  <path d="M 78,135 Q 40,110 50,75" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Punho da Manga Amarelo com Vermelho -->
  <circle cx="50" cy="78" r="9" fill="#facc15"/>
  <circle cx="50" cy="72" r="8" fill="url(#jfSkin)"/>

  <!-- Braço Direito Animado -->
  <path d="M 162,135 Q 195,150 180,185" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="180" cy="182" r="9" fill="#facc15"/>
  <circle cx="180" cy="188" r="8" fill="url(#jfSkin)"/>

  <!-- Cabeça e Rosto -->
  <ellipse cx="90" cy="95" rx="6" ry="9" fill="url(#jfSkin)"/>
  <ellipse cx="150" cy="95" rx="6" ry="9" fill="url(#jfSkin)"/>
  <ellipse cx="120" cy="95" rx="30" ry="28" fill="url(#jfSkin)" filter="url(#jfShadow)"/>

  <!-- Cabelo Ruivo na Frente -->
  <path d="M 92,80 Q 120,62 148,80 Q 140,70 120,68 Q 100,70 92,80 Z" fill="url(#jfHair)"/>
  <path d="M 94,80 Q 98,105 102,110 Q 94,100 94,80 Z" fill="url(#jfHair)"/>
  <path d="M 146,80 Q 142,105 138,110 Q 146,100 146,80 Z" fill="url(#jfHair)"/>

  <!-- Olhos Verdes Animados da Jessie -->
  <ellipse cx="108" cy="93" rx="5" ry="7" fill="#ffffff"/>
  <circle cx="109" cy="93" r="3.2" fill="#15803d"/>
  <circle cx="110" cy="91" r="1.2" fill="#ffffff"/>

  <ellipse cx="132" cy="93" rx="5" ry="7" fill="#ffffff"/>
  <circle cx="131" cy="93" r="3.2" fill="#15803d"/>
  <circle cx="130" cy="91" r="1.2" fill="#ffffff"/>

  <!-- Sardinhas Fofas da Jessie -->
  <circle cx="103" cy="101" r="1" fill="#b45309"/>
  <circle cx="106" cy="103" r="1" fill="#b45309"/>
  <circle cx="134" cy="103" r="1" fill="#b45309"/>
  <circle cx="137" cy="101" r="1" fill="#b45309"/>

  <!-- Sorriso Amplo da Jessie (Yee-haw!) -->
  <path d="M 110,107 Q 120,118 130,107 Z" fill="#dc2626"/>
  <path d="M 112,108 Q 120,112 128,108" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- CHAPÉU VERMELHO DE VAQUEIRA DA JESSIE -->
  <!-- Aba Curvada -->
  <ellipse cx="120" cy="65" rx="65" ry="20" fill="url(#jfHat)" filter="url(#jfShadow)"/>
  <ellipse cx="120" cy="65" rx="60" ry="17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4,3"/>

  <!-- Copa do Chapéu -->
  <path d="M 90,65 C 90,30 150,30 150,65 Z" fill="url(#jfHat)"/>
  <path d="M 94,62 Q 120,55 146,62" stroke="#ffffff" stroke-width="2" fill="none"/>
</svg>
