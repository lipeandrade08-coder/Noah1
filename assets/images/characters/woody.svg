<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Chapéu do Woody -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="50%" stop-color="#6d3e31"/>
      <stop offset="100%" stop-color="#4a261c"/>
    </linearGradient>
    <!-- Pele do Woody -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba"/>
      <stop offset="100%" stop-color="#f5c192"/>
    </linearGradient>
    <!-- Ouro da Estrela do Xerife -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Camisa Xadrez Amarela -->
  <path d="M 45,160 L 155,160 L 165,220 L 35,220 Z" fill="#ffeb3b" filter="url(#dropShadow)"/>
  <!-- Linhas vermelhas da camisa -->
  <line x1="75" y1="160" x2="75" y2="220" stroke="#d32f2f" stroke-width="3"/>
  <line x1="125" y1="160" x2="125" y2="220" stroke="#d32f2f" stroke-width="3"/>
  <line x1="40" y1="185" x2="160" y2="185" stroke="#d32f2f" stroke-width="3"/>

  <!-- Colete de Vaquinha Malhado -->
  <path d="M 40,165 Q 40,215 65,220 L 60,165 Z" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <circle cx="50" cy="180" r="6" fill="#212121"/>
  <path d="M 160,165 Q 160,215 135,220 L 140,165 Z" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <circle cx="150" cy="190" r="7" fill="#212121"/>

  <!-- Estrela de Xerife no Peito -->
  <polygon points="55,190 58,198 66,199 60,205 62,213 55,208 48,213 50,205 44,199 52,198" fill="url(#badgeGold)" stroke="#d97706" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Lenço Vermelho do Pescoço -->
  <path d="M 75,145 Q 100,165 125,145 Q 100,180 75,145 Z" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <circle cx="100" cy="165" r="4" fill="#ffffff"/>

  <!-- Cabeça e Orelhas -->
  <ellipse cx="65" cy="115" rx="8" ry="12" fill="url(#skinGrad)"/>
  <ellipse cx="135" cy="115" rx="8" ry="12" fill="url(#skinGrad)"/>
  <path d="M 70,110 C 70,60 130,60 130,110 C 130,145 70,145 70,110 Z" fill="url(#skinGrad)" filter="url(#dropShadow)"/>

  <!-- Cabelo Castanho do Woody -->
  <path d="M 68,95 Q 100,75 132,95 Q 130,70 100,68 Q 70,70 68,95 Z" fill="#4e2716"/>

  <!-- Olhos Castanhos -->
  <ellipse cx="88" cy="105" rx="6" ry="8" fill="#ffffff"/>
  <circle cx="89" cy="105" r="3.5" fill="#5d4037"/>
  <circle cx="91" cy="103" r="1.5" fill="#ffffff"/>

  <ellipse cx="112" cy="105" rx="6" ry="8" fill="#ffffff"/>
  <circle cx="111" cy="105" r="3.5" fill="#5d4037"/>
  <circle cx="113" cy="103" r="1.5" fill="#ffffff"/>

  <!-- Sobrancelhas Amigáveis -->
  <path d="M 82,94 Q 90,90 95,95" stroke="#4e2716" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 105,95 Q 110,90 118,94" stroke="#4e2716" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nariz e Boca Sorrindo -->
  <path d="M 100,105 Q 103,114 98,116" stroke="#d79a6d" stroke-width="2" fill="none"/>
  <path d="M 86,124 Q 100,138 114,124" stroke="#8d2626" stroke-width="3" fill="#ffffff" stroke-linecap="round"/>

  <!-- Chapéu de Cowboy do Woody -->
  <g id="cowboyHat" filter="url(#dropShadow)">
    <!-- Aba Grande do Chapéu -->
    <ellipse cx="100" cy="72" rx="75" ry="24" fill="url(#hatGrad)"/>
    <ellipse cx="100" cy="72" rx="72" ry="21" fill="none" stroke="#3e1d13" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Copa do Chapéu -->
    <path d="M 72,70 C 70,25 90,15 100,20 C 110,15 130,25 128,70 Z" fill="url(#hatGrad)"/>
    <!-- Fita Marrom Escuro com Costura -->
    <path d="M 72,66 Q 100,74 128,66 Q 128,71 100,78 Q 72,71 72,66 Z" fill="#2d130a"/>
  </g>
</svg>
