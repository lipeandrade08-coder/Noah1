<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente Rosa do Porquinho Hamm -->
    <linearGradient id="piggyPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="50%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#ec407a"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Patinhas do Porquinho -->
  <rect x="60" y="195" width="22" height="20" rx="8" fill="#d81b60" filter="url(#dropShadow)"/>
  <rect x="118" y="195" width="22" height="20" rx="8" fill="#d81b60" filter="url(#dropShadow)"/>

  <!-- Fenda de Moedas no Topo da Cabeça -->
  <rect x="85" y="45" width="30" height="6" rx="3" fill="#212121"/>

  <!-- Orelhas Triangulares Rosadas -->
  <polygon points="50,90 35,50 70,68" fill="#d81b60" stroke="#c2185b" stroke-width="2" filter="url(#dropShadow)"/>
  <polygon points="150,90 165,50 130,68" fill="#d81b60" stroke="#c2185b" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Corpo Redondo de Porquinho Cofre -->
  <circle cx="100" cy="130" r="68" fill="url(#piggyPink)" filter="url(#dropShadow)"/>
  <!-- Brilho no corpo -->
  <ellipse cx="75" cy="95" rx="18" ry="10" fill="#ffffff" opacity="0.35" transform="rotate(-30 75 95)"/>

  <!-- Olhos Castanhos e Espertos do Hamm -->
  <ellipse cx="80" cy="115" rx="6" ry="8" fill="#212121"/>
  <circle cx="82" cy="113" r="2" fill="#ffffff"/>

  <ellipse cx="120" cy="115" rx="6" ry="8" fill="#212121"/>
  <circle cx="122" cy="113" r="2" fill="#ffffff"/>

  <!-- Sobrancelhas Cínicas / Simpáticas -->
  <path d="M 72,102 Q 80,98 88,104" stroke="#ad1457" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112,104 Q 120,98 128,102" stroke="#ad1457" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Focinho de Porco com Narinas -->
  <g filter="url(#dropShadow)">
    <ellipse cx="100" cy="142" rx="26" ry="18" fill="#f06292" stroke="#c2185b" stroke-width="2.5"/>
    <ellipse cx="91" cy="142" rx="5" ry="7" fill="#880e4f"/>
    <ellipse cx="109" cy="142" rx="5" ry="7" fill="#880e4f"/>
  </g>

  <!-- Sorrisinho de Canto de Boca -->
  <path d="M 92,168 Q 100,174 114,166" stroke="#880e4f" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
