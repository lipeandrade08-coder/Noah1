<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 400" width="100%" height="100%">
  <defs>
    <!-- Gradientes da Armadura Espacial do Buzz -->
    <linearGradient id="bzWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bzGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="60%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="bzPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="bzSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba06e"/>
    </linearGradient>
    <filter id="bzShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra no Chão -->
  <ellipse cx="130" cy="385" rx="65" ry="10" fill="rgba(0,0,0,0.25)"/>

  <!-- ASAS ESPACIAIS ABERTAS DO BUZZ (Atrás do Tronco) -->
  <g id="buzz-wings">
    <!-- Asa Esquerda -->
    <path d="M 65,140 L 15,100 L 10,135 L 65,160 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <!-- Listras Vermelho / Verde da Asa -->
    <path d="M 15,100 L 28,109 L 24,141 L 10,135 Z" fill="#ef4444"/>
    <path d="M 28,109 L 42,119 L 38,148 L 24,141 Z" fill="#84cc16"/>
    <!-- Luz Vermelha na Ponta da Asa -->
    <circle cx="15" cy="100" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>

    <!-- Asa Direita -->
    <path d="M 195,140 L 245,100 L 250,135 L 195,160 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <!-- Listras Vermelho / Verde da Asa Direita -->
    <path d="M 245,100 L 232,109 L 236,141 L 250,135 Z" fill="#ef4444"/>
    <path d="M 232,109 L 218,119 L 222,148 L 236,141 Z" fill="#84cc16"/>
    <!-- Luz Verde na Ponta da Asa Direita -->
    <circle cx="245" cy="100" r="5" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  </g>

  <!-- Pernas da Armadura -->
  <!-- Perna Esquerda -->
  <g filter="url(#bzShadow)">
    <path d="M 90,225 L 85,315 L 115,315 L 120,225 Z" fill="url(#bzWhite)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Detalhe do Joelho -->
    <rect x="85" y="260" width="30" height="12" rx="4" fill="url(#bzGreen)"/>
  </g>

  <!-- Perna Direita -->
  <g filter="url(#bzShadow)">
    <path d="M 140,225 L 145,315 L 175,315 L 170,225 Z" fill="url(#bzWhite)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Detalhe do Joelho -->
    <rect x="145" y="260" width="30" height="12" rx="4" fill="url(#bzGreen)"/>
  </g>

  <!-- Botas Espaciais -->
  <!-- Bota Esquerda -->
  <g filter="url(#bzShadow)">
    <path d="M 75,315 L 118,315 L 115,365 L 68,365 L 68,345 Q 75,335 75,315 Z" fill="url(#bzWhite)" stroke="#64748b" stroke-width="2"/>
    <path d="M 66,355 L 117,355 L 115,368 L 66,368 Z" fill="url(#bzGreen)"/>
    <ellipse cx="92" cy="335" rx="10" ry="5" fill="url(#bzPurple)"/>
  </g>

  <!-- Bota Direita -->
  <g filter="url(#bzShadow)">
    <path d="M 142,315 L 185,315 Q 185,335 192,345 L 192,365 L 145,365 L 142,315 Z" fill="url(#bzWhite)" stroke="#64748b" stroke-width="2"/>
    <path d="M 143,355 L 194,355 L 194,368 L 143,368 Z" fill="url(#bzGreen)"/>
    <ellipse cx="168" cy="335" rx="10" ry="5" fill="url(#bzPurple)"/>
  </g>

  <!-- Cintura / Cinto Espacial -->
  <rect x="85" y="210" width="90" height="20" rx="6" fill="#334155"/>
  <rect x="115" y="212" width="30" height="16" rx="4" fill="url(#bzGreen)"/>

  <!-- Tronco / Peitoral da Armadura -->
  <path d="M 70,125 L 190,125 L 178,215 L 82,215 Z" fill="url(#bzWhite)" filter="url(#bzShadow)"/>

  <!-- Placa Peitoral Verde Suave -->
  <path d="M 74,130 L 186,130 L 180,180 L 80,180 Z" fill="url(#bzGreen)"/>

  <!-- Botões de Controle no Peito Direito -->
  <ellipse cx="160" cy="145" rx="9" ry="5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <ellipse cx="160" cy="158" rx="9" ry="5" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <ellipse cx="160" cy="171" rx="9" ry="5" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>

  <!-- Emblema Space Ranger no Peito Esquerdo -->
  <ellipse cx="105" cy="155" rx="14" ry="14" fill="#3b82f6"/>
  <polygon points="105,145 110,158 98,150 112,150 100,158" fill="#eab308"/>
  <rect x="94" y="152" width="22" height="4" fill="#ffffff" rx="1"/>

  <!-- Faixa Roxa do Abdômen -->
  <rect x="88" y="186" width="84" height="22" rx="3" fill="url(#bzPurple)"/>
  <line x1="116" y1="186" x2="116" y2="208" stroke="#581c87" stroke-width="3"/>
  <line x1="144" y1="186" x2="144" y2="208" stroke="#581c87" stroke-width="3"/>

  <!-- Braço Esquerdo (Heróico na Cintura) -->
  <path d="M 74,135 Q 40,165 65,205" stroke="url(#bzWhite)" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#bzShadow)"/>
  <!-- Luva Roxa/Verde Esquerda -->
  <circle cx="68" cy="205" r="14" fill="url(#bzPurple)"/>
  <circle cx="68" cy="205" r="9" fill="url(#bzGreen)"/>

  <!-- Braço Direito (Acenando ou Apontando Laser) -->
  <path d="M 186,135 Q 225,145 220,180" stroke="url(#bzWhite)" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#bzShadow)"/>
  <!-- Luva Direita com Botão Laser Vermelho -->
  <circle cx="218" cy="184" r="14" fill="url(#bzPurple)"/>
  <circle cx="218" cy="184" r="8" fill="url(#bzGreen)"/>
  <circle cx="218" cy="184" r="3.5" fill="#ef4444"/>

  <!-- Cabeça e Capuz Roxo do Buzz -->
  <!-- Capuz Roxo -->
  <circle cx="130" cy="85" r="34" fill="url(#bzPurple)" filter="url(#bzShadow)"/>
  <!-- Rosto -->
  <ellipse cx="130" cy="88" rx="24" ry="24" fill="url(#bzSkin)"/>

  <!-- Cúpula do Capacete Transparente (Efeito Vidro) -->
  <ellipse cx="130" cy="84" rx="42" ry="40" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.8"/>
  <ellipse cx="118" cy="68" rx="22" ry="10" fill="#ffffff" opacity="0.3" transform="rotate(-15, 118, 68)"/>

  <!-- Detalhes do Rosto: Olhos Azuis Confiantes -->
  <ellipse cx="120" cy="82" rx="4.5" ry="6" fill="#ffffff"/>
  <circle cx="121" cy="82" r="3" fill="#2563eb"/>
  <circle cx="122" cy="80.5" r="1.2" fill="#ffffff"/>

  <ellipse cx="140" cy="82" rx="4.5" ry="6" fill="#ffffff"/>
  <circle cx="139" cy="82" r="3" fill="#2563eb"/>
  <circle cx="138" cy="80.5" r="1.2" fill="#ffffff"/>

  <!-- Sobrancelhas Arrojadas -->
  <path d="M 114,75 Q 120,72 126,75" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 134,75 Q 140,72 146,75" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nariz Empinado e Sorriso Confiante -->
  <path d="M 130,83 L 128,91 L 133,91" stroke="#ea580c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Sorriso -->
  <path d="M 122,96 Q 130,103 138,96" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Covinha do Queixo Clássica do Buzz -->
  <ellipse cx="130" cy="103" rx="3.5" ry="2" fill="#d97706"/>
</svg>
