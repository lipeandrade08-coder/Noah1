<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Chapéu Vermelho da Jessie -->
    <linearGradient id="jessieRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="50%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <!-- Pele da Jessie -->
    <linearGradient id="jessieSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba"/>
      <stop offset="100%" stop-color="#f5c192"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Trança Ruiva Lateral com Laço Amarelo -->
  <path d="M 55,120 Q 30,160 40,195 Q 48,210 55,200" stroke="#b71c1c" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Laço Amarelo da Trança -->
  <circle cx="50" cy="195" r="7" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/>

  <!-- Blusa Branca e Amarela de Vaqueira -->
  <path d="M 50,155 L 150,155 L 160,220 L 40,220 Z" fill="#ffffff" filter="url(#dropShadow)"/>
  <!-- Peitilho Amarelo da Jessie -->
  <path d="M 65,155 L 135,155 L 125,190 L 75,190 Z" fill="#ffeb3b" stroke="#d32f2f" stroke-width="2"/>
  <!-- Detalhes de Costura Vermelha na Blusa -->
  <path d="M 80,165 Q 100,180 120,165" stroke="#d32f2f" stroke-width="3" fill="none"/>

  <!-- Cabeça e Orelhas da Jessie -->
  <ellipse cx="68" cy="120" rx="7" ry="10" fill="url(#jessieSkin)"/>
  <ellipse cx="132" cy="120" rx="7" ry="10" fill="url(#jessieSkin)"/>
  <path d="M 72,115 C 72,70 128,70 128,115 C 128,150 72,150 72,115 Z" fill="url(#jessieSkin)" filter="url(#dropShadow)"/>

  <!-- Franja Ruiva da Jessie -->
  <path d="M 70,102 Q 100,90 130,102 Q 128,75 100,74 Q 72,75 70,102 Z" fill="#b71c1c"/>

  <!-- Olhos Verdes Alegres -->
  <ellipse cx="88" cy="112" rx="6" ry="8" fill="#ffffff"/>
  <circle cx="89" cy="112" r="3.5" fill="#2e7d32"/>
  <circle cx="91" cy="110" r="1.5" fill="#ffffff"/>

  <ellipse cx="112" cy="112" rx="6" ry="8" fill="#ffffff"/>
  <circle cx="111" cy="112" r="3.5" fill="#2e7d32"/>
  <circle cx="113" cy="110" r="1.5" fill="#ffffff"/>

  <!-- Cílios Fofinhos -->
  <line x1="82" y1="106" x2="86" y2="108" stroke="#212121" stroke-width="1.8"/>
  <line x1="118" y1="106" x2="114" y2="108" stroke="#212121" stroke-width="1.8"/>

  <!-- Bochechas Rosadinhas -->
  <ellipse cx="80" cy="122" rx="6" ry="4" fill="#ff8a80" opacity="0.6"/>
  <ellipse cx="120" cy="122" rx="6" ry="4" fill="#ff8a80" opacity="0.6"/>

  <!-- Nariz e Sorriso Aberto -->
  <path d="M 100,114 Q 102,120 98,121" stroke="#d79a6d" stroke-width="1.8" fill="none"/>
  <path d="M 88,128 Q 100,142 112,128" stroke="#b71c1c" stroke-width="2.5" fill="#ffffff" stroke-linecap="round"/>

  <!-- Chapéu de Vaqueira Vermelho com Fita Branca -->
  <g id="jessieHat" filter="url(#dropShadow)">
    <ellipse cx="100" cy="74" rx="74" ry="24" fill="url(#jessieRed)"/>
    <ellipse cx="100" cy="74" rx="70" ry="21" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>
    <path d="M 74,72 C 72,30 90,20 100,24 C 110,20 128,30 126,72 Z" fill="url(#jessieRed)"/>
    <path d="M 74,68 Q 100,76 126,68 Q 126,73 100,80 Q 74,73 74,68 Z" fill="#ffffff"/>
  </g>
</svg>
