<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Verde do Marciano -->
    <linearGradient id="alienGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4f738"/>
      <stop offset="50%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <!-- Azul do Pizza Planet -->
    <linearGradient id="alienBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Traje Espacial Azul -->
  <path d="M 45,150 L 155,150 L 165,220 L 35,220 Z" fill="url(#alienBlue)" filter="url(#dropShadow)"/>
  <!-- Gola Roxa -->
  <path d="M 60,150 Q 100,165 140,150 Q 100,175 60,150 Z" fill="#7b1fa2"/>
  <!-- Emblema do Pizza Planet no Peito -->
  <circle cx="75" cy="185" r="8" fill="#e53935"/>
  <ellipse cx="75" cy="185" rx="14" ry="4" fill="none" stroke="#fff176" stroke-width="2" transform="rotate(-25 75 185)"/>

  <!-- Antena com Bolinha no Topo -->
  <path d="M 100,65 L 100,32" stroke="#689f38" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="26" r="9" fill="url(#alienGreen)" stroke="#558b2f" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Orelhas Pontudas -->
  <path d="M 45,95 Q 20,80 15,100 Q 30,105 50,105 Z" fill="url(#alienGreen)" filter="url(#dropShadow)"/>
  <path d="M 155,95 Q 180,80 185,100 Q 170,105 150,105 Z" fill="url(#alienGreen)" filter="url(#dropShadow)"/>

  <!-- Cabeça Ovalada Verde -->
  <ellipse cx="100" cy="105" rx="56" ry="46" fill="url(#alienGreen)" filter="url(#dropShadow)"/>

  <!-- Três Olhos Grandões -->
  <!-- Olho Esquerdo -->
  <ellipse cx="72" cy="95" rx="11" ry="13" fill="#ffffff" stroke="#33691e" stroke-width="1.5"/>
  <circle cx="72" cy="95" r="5" fill="#212121"/>
  <circle cx="74" cy="93" r="2" fill="#ffffff"/>

  <!-- Olho Central -->
  <ellipse cx="100" cy="90" rx="12" ry="14" fill="#ffffff" stroke="#33691e" stroke-width="1.5"/>
  <circle cx="100" cy="90" r="5.5" fill="#212121"/>
  <circle cx="102" cy="88" r="2.2" fill="#ffffff"/>

  <!-- Olho Direito -->
  <ellipse cx="128" cy="95" rx="11" ry="13" fill="#ffffff" stroke="#33691e" stroke-width="1.5"/>
  <circle cx="128" cy="95" r="5" fill="#212121"/>
  <circle cx="130" cy="93" r="2" fill="#ffffff"/>

  <!-- Boca em Formato "Ooooh!" Maravilhada -->
  <ellipse cx="100" cy="125" rx="12" ry="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <ellipse cx="100" cy="125" rx="9" ry="7" fill="#1b5e20"/>
</svg>
