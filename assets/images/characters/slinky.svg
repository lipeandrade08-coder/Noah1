<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente Castanho do Slinky -->
    <linearGradient id="dogBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="50%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Mola de Metal no Corpo (Slinky Coil) -->
  <g stroke="#9e9e9e" stroke-width="5" fill="none" stroke-linecap="round">
    <ellipse cx="65" cy="190" rx="14" ry="22"/>
    <ellipse cx="85" cy="190" rx="14" ry="22"/>
    <ellipse cx="105" cy="190" rx="14" ry="22"/>
    <ellipse cx="125" cy="190" rx="14" ry="22"/>
    <ellipse cx="145" cy="190" rx="14" ry="22"/>
  </g>
  <!-- Patinhas Traseiras e Rabinho -->
  <path d="M 155,185 Q 180,165 175,150" stroke="#795548" stroke-width="4" fill="none"/>
  <circle cx="175" cy="150" r="5" fill="#5d4037"/>

  <!-- Coleira Verde do Slinky -->
  <ellipse cx="100" cy="162" rx="36" ry="12" fill="#4caf50" stroke="#2e7d32" stroke-width="2.5" filter="url(#dropShadow)"/>

  <!-- Orelhas Caídas Compridas -->
  <path d="M 52,105 C 30,120 25,170 45,175 C 55,175 65,135 60,110 Z" fill="#4e342e" filter="url(#dropShadow)"/>
  <path d="M 148,105 C 170,120 175,170 155,175 C 145,175 135,135 140,110 Z" fill="#4e342e" filter="url(#dropShadow)"/>

  <!-- Cabeça Fofa de Cachorrinho -->
  <ellipse cx="100" cy="115" rx="44" ry="40" fill="url(#dogBrown)" filter="url(#dropShadow)"/>

  <!-- Focinho Marrom Claro -->
  <ellipse cx="100" cy="132" rx="26" ry="18" fill="#d7ccc8"/>

  <!-- Focinho / Trufa Preta -->
  <ellipse cx="100" cy="124" rx="12" ry="8" fill="#212121"/>
  <ellipse cx="97" cy="122" rx="3" ry="2" fill="#ffffff"/>

  <!-- Olhos Carinhosos do Slinky -->
  <ellipse cx="84" cy="104" rx="7" ry="9" fill="#ffffff" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="85" cy="104" r="4" fill="#3e2723"/>
  <circle cx="87" cy="102" r="1.5" fill="#ffffff"/>

  <ellipse cx="116" cy="104" rx="7" ry="9" fill="#ffffff" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="115" cy="104" r="4" fill="#3e2723"/>
  <circle cx="117" cy="102" r="1.5" fill="#ffffff"/>

  <!-- Língua Rosada para Fora -->
  <path d="M 94,142 Q 100,154 106,142 Z" fill="#ff4081" stroke="#c2185b" stroke-width="1.5"/>
  <!-- Linha da Boca -->
  <path d="M 88,138 Q 100,146 112,138" stroke="#3e2723" stroke-width="2" fill="none"/>
</svg>
