<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente Verde do Rex -->
    <linearGradient id="rexGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="50%" stop-color="#689f38"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Corpo do Rex -->
  <path d="M 50,150 Q 100,130 150,150 L 165,220 L 35,220 Z" fill="url(#rexGreen)" filter="url(#dropShadow)"/>

  <!-- Bracinhos Curtinhos do T-Rex -->
  <path d="M 68,160 Q 60,180 75,188 L 78,175" stroke="#33691e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="76" cy="188" r="4" fill="#33691e"/>
  <path d="M 132,160 Q 140,180 125,188 L 122,175" stroke="#33691e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="124" cy="188" r="4" fill="#33691e"/>

  <!-- Cabeça e Focinho do Rex -->
  <path d="M 60,95 C 60,50 140,50 140,95 C 140,120 155,130 150,145 C 145,158 100,165 60,145 C 55,130 60,120 60,95 Z" fill="url(#rexGreen)" filter="url(#dropShadow)"/>

  <!-- Narinas do Dinossauro -->
  <ellipse cx="130" cy="132" rx="4" ry="3" fill="#1b5e20"/>
  <ellipse cx="118" cy="130" rx="3.5" ry="2.5" fill="#1b5e20"/>

  <!-- Olhos do Rex (Grandes e Expressivos) -->
  <ellipse cx="78" cy="82" rx="10" ry="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="80" cy="82" r="5" fill="#212121"/>
  <circle cx="82" cy="79" r="2" fill="#ffffff"/>

  <ellipse cx="112" cy="80" rx="10" ry="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="114" cy="80" r="5" fill="#212121"/>
  <circle cx="116" cy="77" r="2" fill="#ffffff"/>

  <!-- Sobrancelhas Assustadinhas/Doces -->
  <path d="M 72,70 Q 78,66 84,72" stroke="#1b5e20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 108,70 Q 114,66 120,72" stroke="#1b5e20" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Boca Aberta e Dentes Afiados Fofinhos -->
  <path d="M 70,125 Q 110,145 145,135 Q 120,160 85,155 Z" fill="#b71c1c" stroke="#1b5e20" stroke-width="2"/>
  
  <!-- Dentes Brancos -->
  <polygon points="78,126 83,133 88,128" fill="#ffffff"/>
  <polygon points="90,128 95,135 100,130" fill="#ffffff"/>
  <polygon points="102,130 107,137 112,132" fill="#ffffff"/>
  <polygon points="115,132 120,139 125,134" fill="#ffffff"/>
  <polygon points="128,134 133,141 138,135" fill="#ffffff"/>
</svg>
