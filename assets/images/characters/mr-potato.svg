<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente Batata -->
    <linearGradient id="potatoBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="40%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Pés / Sapatos Azuis -->
  <ellipse cx="75" cy="210" rx="22" ry="10" fill="#1976d2" filter="url(#dropShadow)"/>
  <ellipse cx="125" cy="210" rx="22" ry="10" fill="#1976d2" filter="url(#dropShadow)"/>

  <!-- Corpo Oval em Formato de Batata -->
  <path d="M 55,130 C 45,70 70,60 100,60 C 130,60 155,70 145,130 C 150,185 140,205 100,205 C 60,205 50,185 55,130 Z" fill="url(#potatoBrown)" filter="url(#dropShadow)"/>

  <!-- Orelhas Rosadas de Encaixar -->
  <ellipse cx="44" cy="115" rx="8" ry="14" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/>
  <ellipse cx="156" cy="115" rx="8" ry="14" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/>

  <!-- Olhos de Plástico Desajeitados -->
  <ellipse cx="88" cy="98" rx="10" ry="13" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <circle cx="89" cy="98" r="4.5" fill="#212121"/>
  <circle cx="91" cy="96" r="1.5" fill="#ffffff"/>

  <ellipse cx="112" cy="98" rx="10" ry="13" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <circle cx="111" cy="98" r="4.5" fill="#212121"/>
  <circle cx="113" cy="96" r="1.5" fill="#ffffff"/>

  <!-- Sobrancelhas Pretas Arqueadas -->
  <path d="M 78,82 Q 88,76 96,82" stroke="#212121" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 104,82 Q 112,76 122,82" stroke="#212121" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Nariz Grandão Rosa/Vermelho de Batata -->
  <ellipse cx="100" cy="120" rx="18" ry="15" fill="#ef5350" stroke="#c62828" stroke-width="2" filter="url(#dropShadow)"/>
  <ellipse cx="94" cy="115" rx="5" ry="3" fill="#ffffff" opacity="0.4"/>

  <!-- Bigode Preto Farto Clássico -->
  <path d="M 70,138 C 85,130 95,145 100,138 C 105,145 115,130 130,138 C 132,146 120,154 100,148 C 80,154 68,146 70,138 Z" fill="#212121" filter="url(#dropShadow)"/>

  <!-- Boca Sorridente com Dentes Brancos -->
  <path d="M 80,158 Q 100,178 120,158 Z" fill="#b71c1c" stroke="#212121" stroke-width="2"/>
  <rect x="90" y="159" width="20" height="7" rx="2" fill="#ffffff"/>

  <!-- Chapeuzinho Preto / Cartola do Sr. Cabeça de Batata -->
  <g id="potatoHat" filter="url(#dropShadow)">
    <ellipse cx="100" cy="62" rx="42" ry="12" fill="#212121"/>
    <path d="M 75,60 C 74,32 85,26 100,26 C 115,26 126,32 125,60 Z" fill="#212121"/>
    <rect x="75" y="54" width="50" height="6" fill="#1565c0"/>
  </g>
</svg>
